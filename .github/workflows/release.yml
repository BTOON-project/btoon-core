name: Release

# Builds the btoon CLI tools for each platform and attaches them to the GitHub
# release for a tag like v0.1.0. Library consumers build from source (CMake).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-universal, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF)
          case "${{ matrix.target }}" in
            macos-universal) args+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0) ;;
            windows-x64) args+=(-DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
                                -DVCPKG_TARGET_TRIPLET=x64-windows-static
                                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded) ;;
          esac
          cmake -S . -B build "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: bash
        run: |
          name="btoon-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for tool in btoon btoon-convert btoon-schema; do
            if [ -f "build/Release/$tool.exe" ]; then cp "build/Release/$tool.exe" "dist/$name/";
            else cp "build/$tool" "dist/$name/"; fi
          done
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.*z*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- ./* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
